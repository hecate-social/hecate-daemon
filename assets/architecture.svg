<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
  <defs>
    <style>
      .title { font: bold 24px sans-serif; fill: #1a1a2e; }
      .subtitle { font: bold 14px sans-serif; fill: #4a4a6a; }
      .label { font: 12px sans-serif; fill: #2d2d44; }
      .small { font: 10px sans-serif; fill: #5a5a7a; }
      .code { font: 11px monospace; fill: #3a3a5a; }

      .box-api { fill: #e8f4f8; stroke: #4a90a4; stroke-width: 2; rx: 8; }
      .box-core { fill: #f0e8f8; stroke: #7a5a94; stroke-width: 2; rx: 8; }
      .box-command { fill: #e8f8e8; stroke: #5a9a5a; stroke-width: 2; rx: 8; }
      .box-query { fill: #f8f0e8; stroke: #a4845a; stroke-width: 2; rx: 8; }
      .box-mesh { fill: #f8e8e8; stroke: #a45a5a; stroke-width: 2; rx: 8; }
      .box-store { fill: #e8e8f8; stroke: #5a5aa4; stroke-width: 2; rx: 8; }
      .box-external { fill: #f8f8f8; stroke: #8a8a8a; stroke-width: 2; rx: 8; stroke-dasharray: 5,3; }

      .arrow { fill: none; stroke: #4a4a6a; stroke-width: 2; marker-end: url(#arrowhead); }
      .arrow-event { fill: none; stroke: #5a9a5a; stroke-width: 2; marker-end: url(#arrowhead-green); stroke-dasharray: 6,3; }
      .arrow-mesh { fill: none; stroke: #a45a5a; stroke-width: 2; marker-end: url(#arrowhead-red); }

      .domain-group { fill: #fafafa; stroke: #d0d0d0; stroke-width: 1; rx: 12; }
    </style>

    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a4a6a"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#5a9a5a"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a45a5a"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="35" text-anchor="middle" class="title">macula-hecate Architecture</text>
  <text x="600" y="55" text-anchor="middle" class="small">Erlang Daemon for AI Agent Mesh Connectivity</text>

  <!-- External: Agent -->
  <rect x="30" y="80" width="140" height="60" class="box-external"/>
  <text x="100" y="105" text-anchor="middle" class="subtitle">AI Agent</text>
  <text x="100" y="125" text-anchor="middle" class="small">(any runtime)</text>

  <!-- External: Macula Mesh -->
  <rect x="1030" y="80" width="140" height="60" class="box-external"/>
  <text x="1100" y="105" text-anchor="middle" class="subtitle">Macula Mesh</text>
  <text x="1100" y="125" text-anchor="middle" class="small">HTTP/3 (QUIC)</text>

  <!-- Arrow: Agent to API -->
  <path d="M 170 110 L 215 110" class="arrow"/>
  <text x="192" y="100" text-anchor="middle" class="small">REST</text>

  <!-- REST API Layer -->
  <rect x="220" y="75" width="200" height="75" class="box-api"/>
  <text x="320" y="100" text-anchor="middle" class="subtitle">hecate_api</text>
  <text x="320" y="118" text-anchor="middle" class="code">:4444</text>
  <text x="320" y="135" text-anchor="middle" class="small">Cowboy HTTP handlers</text>

  <!-- Core Services -->
  <rect x="440" y="75" width="340" height="75" class="box-core"/>
  <text x="610" y="98" text-anchor="middle" class="subtitle">Core Services (hecate_sup)</text>

  <text x="480" y="118" text-anchor="middle" class="code">hecate_store</text>
  <text x="560" y="118" text-anchor="middle" class="code">hecate_identity</text>
  <text x="650" y="118" text-anchor="middle" class="code">hecate_realm_session</text>
  <text x="730" y="118" text-anchor="middle" class="code">hecate_ucan</text>

  <text x="480" y="135" text-anchor="middle" class="small">SQLite</text>
  <text x="560" y="135" text-anchor="middle" class="small">MRI+Keys</text>
  <text x="650" y="135" text-anchor="middle" class="small">OAuth Join</text>
  <text x="730" y="135" text-anchor="middle" class="small">Tokens</text>

  <!-- Mesh Layer -->
  <rect x="800" y="75" width="210" height="75" class="box-mesh"/>
  <text x="905" y="98" text-anchor="middle" class="subtitle">hecate_mesh</text>
  <text x="860" y="120" text-anchor="middle" class="code">mesh_client</text>
  <text x="950" y="120" text-anchor="middle" class="code">mesh_publisher</text>
  <text x="905" y="140" text-anchor="middle" class="small">DHT pub/sub + RPC</text>

  <!-- Arrow: Mesh to External -->
  <path d="M 1010 110 L 1025 110" class="arrow-mesh"/>

  <!-- Arrow: API to Core -->
  <path d="M 420 110 L 435 110" class="arrow"/>

  <!-- Arrow: Core to Mesh -->
  <path d="M 780 110 L 795 110" class="arrow"/>

  <!-- CQRS Section Header -->
  <text x="600" y="185" text-anchor="middle" class="subtitle">CQRS Domain Services</text>

  <!-- Command Services (Write Side) -->
  <rect x="30" y="200" width="560" height="320" class="domain-group"/>
  <text x="310" y="225" text-anchor="middle" class="subtitle">Command Services (Write Side)</text>

  <!-- manage_capabilities -->
  <rect x="50" y="240" width="165" height="85" class="box-command"/>
  <text x="132" y="260" text-anchor="middle" class="code">manage_capabilities</text>
  <text x="132" y="280" text-anchor="middle" class="small">announce_capability</text>
  <text x="132" y="295" text-anchor="middle" class="small">update_capability</text>
  <text x="132" y="310" text-anchor="middle" class="small">retract_capability</text>

  <!-- manage_identities -->
  <rect x="225" y="240" width="165" height="85" class="box-command"/>
  <text x="307" y="260" text-anchor="middle" class="code">manage_identities</text>
  <text x="307" y="280" text-anchor="middle" class="small">register_identity</text>
  <text x="307" y="295" text-anchor="middle" class="small">update_identity</text>

  <!-- manage_reputation -->
  <rect x="400" y="240" width="175" height="85" class="box-command"/>
  <text x="487" y="260" text-anchor="middle" class="code">manage_reputation</text>
  <text x="487" y="280" text-anchor="middle" class="small">track_rpc_call</text>
  <text x="487" y="295" text-anchor="middle" class="small">flag_dispute</text>
  <text x="487" y="310" text-anchor="middle" class="small">resolve_dispute</text>

  <!-- manage_social -->
  <rect x="50" y="335" width="165" height="85" class="box-command"/>
  <text x="132" y="355" text-anchor="middle" class="code">manage_social</text>
  <text x="132" y="375" text-anchor="middle" class="small">record_follower</text>
  <text x="132" y="390" text-anchor="middle" class="small">record_unfollower</text>
  <text x="132" y="405" text-anchor="middle" class="small">endorse_capability</text>

  <!-- manage_subscriptions -->
  <rect x="225" y="335" width="165" height="85" class="box-command"/>
  <text x="307" y="355" text-anchor="middle" class="code">manage_subscriptions</text>
  <text x="307" y="375" text-anchor="middle" class="small">subscribe</text>
  <text x="307" y="390" text-anchor="middle" class="small">unsubscribe</text>

  <!-- manage_ucan -->
  <rect x="400" y="335" width="175" height="85" class="box-command"/>
  <text x="487" y="355" text-anchor="middle" class="code">manage_ucan</text>
  <text x="487" y="375" text-anchor="middle" class="small">grant_capability</text>
  <text x="487" y="390" text-anchor="middle" class="small">revoke_capability</text>

  <!-- Command Pattern Legend -->
  <rect x="50" y="435" width="525" height="70" fill="#f8fff8" stroke="#5a9a5a" stroke-width="1" rx="6"/>
  <text x="60" y="455" class="small" font-weight="bold">Command Pattern:</text>
  <text x="60" y="475" class="code">command_v1.erl → maybe_command.erl → evoq_dispatcher</text>
  <text x="60" y="495" class="code">                      ↓ stores → event_v1 → event_to_mesh.erl</text>

  <!-- Query Services (Read Side) -->
  <rect x="610" y="200" width="560" height="320" class="domain-group"/>
  <text x="890" y="225" text-anchor="middle" class="subtitle">Query Services (Read Side)</text>

  <!-- query_capabilities -->
  <rect x="630" y="240" width="165" height="85" class="box-query"/>
  <text x="712" y="260" text-anchor="middle" class="code">query_capabilities</text>
  <text x="712" y="280" text-anchor="middle" class="small">find_capability</text>
  <text x="712" y="295" text-anchor="middle" class="small">list_capabilities</text>
  <text x="712" y="310" text-anchor="middle" class="small">remote_listener</text>

  <!-- query_identities -->
  <rect x="805" y="240" width="165" height="85" class="box-query"/>
  <text x="887" y="260" text-anchor="middle" class="code">query_identities</text>
  <text x="887" y="280" text-anchor="middle" class="small">find_identity</text>
  <text x="887" y="295" text-anchor="middle" class="small">list_identities</text>

  <!-- query_reputation -->
  <rect x="980" y="240" width="175" height="85" class="box-query"/>
  <text x="1067" y="260" text-anchor="middle" class="code">query_reputation</text>
  <text x="1067" y="280" text-anchor="middle" class="small">get_reputation</text>
  <text x="1067" y="295" text-anchor="middle" class="small">list_rpc_calls</text>
  <text x="1067" y="310" text-anchor="middle" class="small">list_disputes</text>

  <!-- query_social -->
  <rect x="630" y="335" width="165" height="85" class="box-query"/>
  <text x="712" y="355" text-anchor="middle" class="code">query_social</text>
  <text x="712" y="375" text-anchor="middle" class="small">get_social_graph</text>
  <text x="712" y="390" text-anchor="middle" class="small">get_followers</text>
  <text x="712" y="405" text-anchor="middle" class="small">get_endorsements</text>

  <!-- query_subscriptions -->
  <rect x="805" y="335" width="165" height="85" class="box-query"/>
  <text x="887" y="355" text-anchor="middle" class="code">query_subscriptions</text>
  <text x="887" y="375" text-anchor="middle" class="small">list_subscriptions</text>
  <text x="887" y="390" text-anchor="middle" class="small">get_stats</text>

  <!-- query_ucan -->
  <rect x="980" y="335" width="175" height="85" class="box-query"/>
  <text x="1067" y="355" text-anchor="middle" class="code">query_ucan</text>
  <text x="1067" y="375" text-anchor="middle" class="small">verify_capability</text>
  <text x="1067" y="390" text-anchor="middle" class="small">list_capabilities</text>

  <!-- Query Pattern Legend -->
  <rect x="630" y="435" width="525" height="70" fill="#fffcf8" stroke="#a4845a" stroke-width="1" rx="6"/>
  <text x="640" y="455" class="small" font-weight="bold">Query Pattern:</text>
  <text x="640" y="475" class="code">subscriber.erl (events) → projection.erl → SQLite</text>
  <text x="640" y="495" class="code">query.erl → SQLite SELECT → API response</text>

  <!-- Event Flow Arrows -->
  <path d="M 590 370 L 620 370" class="arrow-event"/>
  <text x="605" y="362" text-anchor="middle" class="small" fill="#5a9a5a">events</text>

  <!-- Storage Layer -->
  <rect x="30" y="540" width="560" height="80" class="box-store"/>
  <text x="310" y="565" text-anchor="middle" class="subtitle">ReckonDB Event Stores</text>
  <text x="310" y="590" text-anchor="middle" class="code">manage_capabilities_db | manage_identities_db | manage_reputation_db</text>
  <text x="310" y="608" text-anchor="middle" class="code">manage_social_db | manage_subscriptions_db | manage_ucan_db</text>

  <rect x="610" y="540" width="560" height="80" class="box-store"/>
  <text x="890" y="565" text-anchor="middle" class="subtitle">SQLite Read Models</text>
  <text x="890" y="590" text-anchor="middle" class="code">capabilities.db | identities.db | reputation.db</text>
  <text x="890" y="608" text-anchor="middle" class="code">social.db | subscriptions.db | ucan.db</text>

  <!-- Arrows to storage -->
  <path d="M 310 505 L 310 535" class="arrow"/>
  <path d="M 890 505 L 890 535" class="arrow"/>

  <!-- Data Flow Legend -->
  <rect x="30" y="640" width="1140" height="120" fill="#fafafa" stroke="#d0d0d0" stroke-width="1" rx="8"/>
  <text x="600" y="665" text-anchor="middle" class="subtitle">Data Flow</text>

  <!-- Command Flow -->
  <rect x="50" y="680" width="340" height="65" fill="#f0fff0" stroke="#5a9a5a" stroke-width="1" rx="6"/>
  <text x="220" y="700" text-anchor="middle" class="small" font-weight="bold">Command Flow (Write)</text>
  <text x="220" y="720" text-anchor="middle" class="code">REST → command_v1 → maybe_* → evoq</text>
  <text x="220" y="735" text-anchor="middle" class="code">→ ReckonDB → event_v1 → mesh</text>

  <!-- Query Flow -->
  <rect x="420" y="680" width="340" height="65" fill="#fffff0" stroke="#a4845a" stroke-width="1" rx="6"/>
  <text x="590" y="700" text-anchor="middle" class="small" font-weight="bold">Query Flow (Read)</text>
  <text x="590" y="720" text-anchor="middle" class="code">event → subscriber → projection</text>
  <text x="590" y="735" text-anchor="middle" class="code">→ SQLite → query → REST response</text>

  <!-- Mesh Flow -->
  <rect x="790" y="680" width="360" height="65" fill="#fff0f0" stroke="#a45a5a" stroke-width="1" rx="6"/>
  <text x="970" y="700" text-anchor="middle" class="small" font-weight="bold">Mesh Integration</text>
  <text x="970" y="720" text-anchor="middle" class="code">EMITTER: event → FACT → DHT publish</text>
  <text x="970" y="735" text-anchor="middle" class="code">LISTENER: DHT → FACT → COMMAND</text>

  <!-- Footer -->
  <text x="600" y="785" text-anchor="middle" class="small">6 domains × 2 services (command + query) = 12 CQRS apps + API + Mesh + Core</text>
  <text x="600" y="805" text-anchor="middle" class="small">Event Sourced with ReckonDB/Evoq | Projections to SQLite | Macula HTTP/3 Mesh</text>

  <!-- Color Legend -->
  <rect x="30" y="820" width="20" height="15" class="box-api"/>
  <text x="55" y="832" class="small">API</text>

  <rect x="100" y="820" width="20" height="15" class="box-core"/>
  <text x="125" y="832" class="small">Core</text>

  <rect x="170" y="820" width="20" height="15" class="box-command"/>
  <text x="195" y="832" class="small">Command</text>

  <rect x="270" y="820" width="20" height="15" class="box-query"/>
  <text x="295" y="832" class="small">Query</text>

  <rect x="350" y="820" width="20" height="15" class="box-mesh"/>
  <text x="375" y="832" class="small">Mesh</text>

  <rect x="420" y="820" width="20" height="15" class="box-store"/>
  <text x="445" y="832" class="small">Storage</text>

  <rect x="510" y="820" width="20" height="15" class="box-external"/>
  <text x="535" y="832" class="small">External</text>

</svg>
