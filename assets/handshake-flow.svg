<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 550">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a855f7"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10b981"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="650" height="550" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="325" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#fff">Agent-to-Agent Handshake Flow</text>

  <!-- Actors -->
  <rect x="50" y="50" width="120" height="40" rx="4" fill="#1e3a5f" stroke="#60a5fa" stroke-width="2"/>
  <text x="110" y="75" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#fff">Agent A</text>

  <rect x="200" y="50" width="120" height="40" rx="4" fill="#2d1b4e" stroke="#a855f7" stroke-width="2"/>
  <text x="260" y="75" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#fff">🗝️ Hecate A</text>

  <rect x="370" y="50" width="120" height="40" rx="4" fill="#2d1b4e" stroke="#a855f7" stroke-width="2"/>
  <text x="430" y="75" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#fff">🗝️ Hecate B</text>

  <rect x="520" y="50" width="100" height="40" rx="4" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="570" y="75" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#fff">Mesh DHT</text>

  <!-- Lifelines -->
  <line x1="110" y1="90" x2="110" y2="530" stroke="#60a5fa" stroke-width="1" stroke-dasharray="4"/>
  <line x1="260" y1="90" x2="260" y2="530" stroke="#a855f7" stroke-width="1" stroke-dasharray="4"/>
  <line x1="430" y1="90" x2="430" y2="530" stroke="#a855f7" stroke-width="1" stroke-dasharray="4"/>
  <line x1="570" y1="90" x2="570" y2="530" stroke="#10b981" stroke-width="1" stroke-dasharray="4"/>

  <!-- Phase 1: Discovery -->
  <rect x="30" y="105" width="80" height="20" rx="2" fill="#3b82f6"/>
  <text x="70" y="119" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#fff">DISCOVER</text>

  <!-- Step 1 -->
  <line x1="115" y1="140" x2="255" y2="140" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="185" y="135" text-anchor="middle" font-family="monospace" font-size="9" fill="#c4b5fd">search("TWEANN")</text>

  <!-- Step 2 -->
  <line x1="265" y1="165" x2="565" y2="165" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="415" y="160" text-anchor="middle" font-family="monospace" font-size="9" fill="#34d399">DHT lookup: capability=TWEANN</text>

  <!-- Step 3 -->
  <line x1="565" y1="190" x2="265" y2="190" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="415" y="185" text-anchor="middle" font-family="monospace" font-size="9" fill="#34d399">{agent_b_mri, reputation: 4.8}</text>

  <!-- Step 4 -->
  <line x1="255" y1="215" x2="115" y2="215" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="185" y="210" text-anchor="middle" font-family="monospace" font-size="9" fill="#c4b5fd">found: Agent B</text>

  <!-- Phase 2: Handshake -->
  <rect x="30" y="240" width="80" height="20" rx="2" fill="#a855f7"/>
  <text x="70" y="254" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#fff">HANDSHAKE</text>

  <!-- Step 5 -->
  <line x1="115" y1="275" x2="255" y2="275" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="185" y="270" text-anchor="middle" font-family="monospace" font-size="9" fill="#c4b5fd">request_capability(B)</text>

  <!-- Step 6 -->
  <line x1="265" y1="300" x2="425" y2="300" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="345" y="295" text-anchor="middle" font-family="monospace" font-size="9" fill="#34d399">HOPE: capability_request</text>

  <!-- Step 7: Hecate B checks A's reputation locally -->
  <rect x="380" y="320" width="100" height="30" rx="3" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
  <text x="430" y="340" text-anchor="middle" font-family="monospace" font-size="8" fill="#60a5fa">query_reputation</text>

  <!-- Step 8 -->
  <line x1="265" y1="365" x2="425" y2="365" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="3" marker-end="url(#arrow-blue)"/>
  <text x="345" y="360" text-anchor="middle" font-family="monospace" font-size="9" fill="#60a5fa">check reputation(A)</text>

  <!-- Step 9 -->
  <line x1="425" y1="390" x2="265" y2="390" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="345" y="385" text-anchor="middle" font-family="monospace" font-size="9" fill="#34d399">FEEDBACK: UCAN granted</text>

  <!-- Phase 3: Execute -->
  <rect x="30" y="415" width="80" height="20" rx="2" fill="#10b981"/>
  <text x="70" y="429" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#fff">EXECUTE</text>

  <!-- Step 10 -->
  <line x1="115" y1="450" x2="255" y2="450" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="185" y="445" text-anchor="middle" font-family="monospace" font-size="9" fill="#c4b5fd">call(B, evolve_nn, {...})</text>

  <!-- Step 11 -->
  <line x1="265" y1="475" x2="425" y2="475" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="345" y="470" text-anchor="middle" font-family="monospace" font-size="9" fill="#34d399">HOPE: evolve_nn</text>

  <!-- Step 12 -->
  <line x1="425" y1="500" x2="265" y2="500" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="345" y="495" text-anchor="middle" font-family="monospace" font-size="9" fill="#34d399">FEEDBACK: evolved_nn</text>

  <!-- Step 13 -->
  <line x1="255" y1="520" x2="115" y2="520" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="185" y="515" text-anchor="middle" font-family="monospace" font-size="9" fill="#c4b5fd">return result</text>

  <!-- Legend -->
  <rect x="470" y="490" width="160" height="50" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
  <line x1="480" y1="505" x2="510" y2="505" stroke="#a855f7" stroke-width="2"/>
  <text x="520" y="509" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">Local API</text>
  <line x1="480" y1="520" x2="510" y2="520" stroke="#10b981" stroke-width="2"/>
  <text x="520" y="524" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">Mesh (HOPE/FEEDBACK)</text>
</svg>
