<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <defs>
    <style>
      .node-box { fill: #1e293b; stroke: #3b82f6; stroke-width: 2; }
      .text-title { fill: #60a5fa; font-family: 'SF Mono', Monaco, monospace; font-size: 14px; font-weight: bold; }
      .text-normal { fill: #e2e8f0; font-family: 'SF Mono', Monaco, monospace; font-size: 12px; }
      .text-small { fill: #94a3b8; font-family: 'SF Mono', Monaco, monospace; font-size: 10px; }
      .arrow { stroke: #3b82f6; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-data { stroke: #22d3ee; stroke-width: 2; fill: none; marker-end: url(#arrowhead-data); stroke-dasharray: 5,5; }
      .phase-label { fill: #a5b4fc; font-size: 16px; font-weight: bold; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#3b82f6" />
    </marker>
    <marker id="arrowhead-data" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#22d3ee" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="500" fill="#0f172a"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" fill="#60a5fa" font-size="20" font-weight="bold">Capability Lifecycle</text>

  <!-- Phase 1: Announce -->
  <text x="150" y="70" text-anchor="middle" class="phase-label">1. ANNOUNCE</text>

  <!-- Agent A -->
  <rect x="50" y="90" width="200" height="80" rx="8" class="node-box"/>
  <text x="150" y="115" text-anchor="middle" class="text-title">Agent A (Provider)</text>
  <text x="150" y="135" text-anchor="middle" class="text-small">has: weather-forecast</text>
  <text x="150" y="150" text-anchor="middle" class="text-small">tags: [weather, forecast]</text>

  <!-- Arrow: announce -->
  <path d="M 150 170 L 150 200" class="arrow"/>
  <text x="160" y="188" class="text-small" fill="#3b82f6">POST /capabilities/announce</text>

  <!-- Hecate A -->
  <rect x="50" y="210" width="200" height="60" rx="8" class="node-box"/>
  <text x="150" y="235" text-anchor="middle" class="text-title">Hecate A</text>
  <text x="150" y="255" text-anchor="middle" class="text-small">registers capability in DHT</text>

  <!-- Arrow: publish to mesh -->
  <path d="M 250 240 L 350 240" class="arrow-data"/>
  <text x="300" y="230" text-anchor="middle" class="text-small" fill="#22d3ee">publishes to mesh DHT</text>

  <!-- Phase 2: Discover -->
  <text x="450" y="70" text-anchor="middle" class="phase-label">2. DISCOVER</text>

  <!-- Agent B -->
  <rect x="650" y="90" width="200" height="80" rx="8" class="node-box"/>
  <text x="750" y="115" text-anchor="middle" class="text-title">Agent B (Consumer)</text>
  <text x="750" y="135" text-anchor="middle" class="text-small">needs: weather data</text>
  <text x="750" y="150" text-anchor="middle" class="text-small">search: [forecast]</text>

  <!-- Arrow: discover -->
  <path d="M 750 170 L 750 200" class="arrow"/>
  <text x="760" y="188" class="text-small" fill="#3b82f6">POST /capabilities/discover</text>

  <!-- Hecate B -->
  <rect x="650" y="210" width="200" height="60" rx="8" class="node-box"/>
  <text x="750" y="235" text-anchor="middle" class="text-title">Hecate B</text>
  <text x="750" y="255" text-anchor="middle" class="text-small">queries DHT for matches</text>

  <!-- Arrow: query DHT -->
  <path d="M 650 240 L 550 240" class="arrow-data"/>
  <text x="600" y="230" text-anchor="middle" class="text-small" fill="#22d3ee">queries DHT</text>

  <!-- Mesh DHT -->
  <rect x="350" y="210" width="200" height="60" rx="8" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
  <text x="450" y="235" text-anchor="middle" class="text-title" fill="#22d3ee">Mesh DHT</text>
  <text x="450" y="255" text-anchor="middle" class="text-small">capability: weather-forecast</text>

  <!-- Phase 3: Call -->
  <text x="750" y="320" text-anchor="middle" class="phase-label">3. CALL</text>

  <!-- Arrow: RPC call -->
  <path d="M 750 290 L 750 340" class="arrow"/>
  <text x="760" y="318" class="text-small" fill="#3b82f6">POST /rpc/call</text>

  <rect x="650" y="350" width="200" height="60" rx="8" class="node-box"/>
  <text x="750" y="375" text-anchor="middle" class="text-title">Hecate B</text>
  <text x="750" y="395" text-anchor="middle" class="text-small">calls weather-forecast RPC</text>

  <!-- Arrow: mesh RPC -->
  <path d="M 650 380 L 250 380" class="arrow-data"/>
  <text x="450" y="370" text-anchor="middle" class="text-small" fill="#22d3ee">RPC via mesh</text>

  <rect x="50" y="350" width="200" height="60" rx="8" class="node-box"/>
  <text x="150" y="375" text-anchor="middle" class="text-title">Hecate A</text>
  <text x="150" y="395" text-anchor="middle" class="text-small">routes to local handler</text>

  <!-- Arrow: local handler -->
  <path d="M 150 350 L 150 310" class="arrow"/>
  <text x="160" y="332" class="text-small" fill="#3b82f6">calls local endpoint</text>

  <rect x="50" y="280" width="200" height="20" rx="4" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="150" y="295" text-anchor="middle" class="text-normal" fill="#10b981">http://localhost:5000/forecast</text>

  <!-- Response -->
  <path d="M 250 290 L 650 370" class="arrow-data"/>
  <text x="450" y="340" text-anchor="middle" class="text-small" fill="#22d3ee">response: {temp: 22°C, ...}</text>

  <!-- Legend -->
  <rect x="20" y="450" width="860" height="35" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="1"/>
  <text x="30" y="470" class="text-small">Legend:</text>
  <line x1="90" y1="465" x2="130" y2="465" class="arrow"/>
  <text x="140" y="470" class="text-small">HTTP (agent ↔ hecate)</text>
  <line x1="320" y1="465" x2="360" y2="465" class="arrow-data"/>
  <text x="370" y="470" class="text-small">Mesh communication (hecate ↔ hecate)</text>
</svg>
