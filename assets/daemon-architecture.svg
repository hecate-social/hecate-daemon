<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650">
  <defs>
    <linearGradient id="appGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f2940;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="meshGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4a1c6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7b2d96;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="storeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a252f;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="650" fill="#0a0a0f"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="20" font-weight="bold">Hecate Daemon Architecture</text>

  <!-- External Layer -->
  <text x="50" y="70" fill="#888" font-family="monospace" font-size="12">External Connections</text>

  <!-- Macula Mesh -->
  <rect x="50" y="85" width="180" height="60" rx="8" fill="url(#meshGrad2)" stroke="#9b59b6" stroke-width="2"/>
  <text x="140" y="115" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12" font-weight="bold">Macula Mesh</text>
  <text x="140" y="132" text-anchor="middle" fill="#d4a5ff" font-family="monospace" font-size="9">boot.macula.io:4433</text>

  <!-- REST API -->
  <rect x="260" y="85" width="180" height="60" rx="8" fill="#1e3a5f" stroke="#3498db" stroke-width="2"/>
  <text x="350" y="115" text-anchor="middle" fill="#3498db" font-family="monospace" font-size="12" font-weight="bold">REST API</text>
  <text x="350" y="132" text-anchor="middle" fill="#85c1e9" font-family="monospace" font-size="9">:4444 (Cowboy)</text>

  <!-- Agent/TUI -->
  <rect x="470" y="85" width="180" height="60" rx="8" fill="#1e3a5f" stroke="#2ecc71" stroke-width="2"/>
  <text x="560" y="115" text-anchor="middle" fill="#2ecc71" font-family="monospace" font-size="12" font-weight="bold">Agent / TUI</text>
  <text x="560" y="132" text-anchor="middle" fill="#82e0aa" font-family="monospace" font-size="9">HTTP client</text>

  <!-- Ollama -->
  <rect x="680" y="85" width="180" height="60" rx="8" fill="#0f3460" stroke="#1abc9c" stroke-width="2"/>
  <text x="770" y="115" text-anchor="middle" fill="#1abc9c" font-family="monospace" font-size="12" font-weight="bold">Ollama</text>
  <text x="770" y="132" text-anchor="middle" fill="#76d7c4" font-family="monospace" font-size="9">localhost:11434</text>

  <!-- Main Daemon Box -->
  <rect x="50" y="170" width="810" height="400" rx="10" fill="#0f0f15" stroke="#e94560" stroke-width="2"/>
  <text x="455" y="195" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="14" font-weight="bold">hecate_sup (OTP Application)</text>

  <!-- Command Services Row -->
  <text x="70" y="225" fill="#f39c12" font-family="monospace" font-size="11" font-weight="bold">Command Services (manage_*)</text>

  <rect x="70" y="235" width="145" height="65" rx="5" fill="url(#appGrad)" stroke="#f39c12" stroke-width="1"/>
  <text x="143" y="260" text-anchor="middle" fill="#f39c12" font-family="monospace" font-size="10">manage_capabilities</text>
  <text x="143" y="280" text-anchor="middle" fill="#f9e79f" font-family="monospace" font-size="8">announce, retract</text>

  <rect x="225" y="235" width="145" height="65" rx="5" fill="url(#appGrad)" stroke="#f39c12" stroke-width="1"/>
  <text x="298" y="260" text-anchor="middle" fill="#f39c12" font-family="monospace" font-size="10">manage_identities</text>
  <text x="298" y="280" text-anchor="middle" fill="#f9e79f" font-family="monospace" font-size="8">register, update</text>

  <rect x="380" y="235" width="145" height="65" rx="5" fill="url(#appGrad)" stroke="#f39c12" stroke-width="1"/>
  <text x="453" y="260" text-anchor="middle" fill="#f39c12" font-family="monospace" font-size="10">manage_social</text>
  <text x="453" y="280" text-anchor="middle" fill="#f9e79f" font-family="monospace" font-size="8">follow, endorse</text>

  <rect x="535" y="235" width="145" height="65" rx="5" fill="url(#appGrad)" stroke="#f39c12" stroke-width="1"/>
  <text x="608" y="260" text-anchor="middle" fill="#f39c12" font-family="monospace" font-size="10">manage_ucan</text>
  <text x="608" y="280" text-anchor="middle" fill="#f9e79f" font-family="monospace" font-size="8">grant, revoke</text>

  <rect x="690" y="235" width="145" height="65" rx="5" fill="url(#appGrad)" stroke="#e94560" stroke-width="2"/>
  <text x="763" y="260" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="10">serve_llm</text>
  <text x="763" y="280" text-anchor="middle" fill="#f1948a" font-family="monospace" font-size="8">LLM capabilities</text>

  <!-- Query Services Row -->
  <text x="70" y="325" fill="#3498db" font-family="monospace" font-size="11" font-weight="bold">Query Services (query_*)</text>

  <rect x="70" y="335" width="145" height="65" rx="5" fill="url(#appGrad)" stroke="#3498db" stroke-width="1"/>
  <text x="143" y="360" text-anchor="middle" fill="#3498db" font-family="monospace" font-size="10">query_capabilities</text>
  <text x="143" y="380" text-anchor="middle" fill="#85c1e9" font-family="monospace" font-size="8">find, list, search</text>

  <rect x="225" y="335" width="145" height="65" rx="5" fill="url(#appGrad)" stroke="#3498db" stroke-width="1"/>
  <text x="298" y="360" text-anchor="middle" fill="#3498db" font-family="monospace" font-size="10">query_identities</text>
  <text x="298" y="380" text-anchor="middle" fill="#85c1e9" font-family="monospace" font-size="8">find, list</text>

  <rect x="380" y="335" width="145" height="65" rx="5" fill="url(#appGrad)" stroke="#3498db" stroke-width="1"/>
  <text x="453" y="360" text-anchor="middle" fill="#3498db" font-family="monospace" font-size="10">query_social</text>
  <text x="453" y="380" text-anchor="middle" fill="#85c1e9" font-family="monospace" font-size="8">followers, following</text>

  <rect x="535" y="335" width="145" height="65" rx="5" fill="url(#appGrad)" stroke="#3498db" stroke-width="1"/>
  <text x="608" y="360" text-anchor="middle" fill="#3498db" font-family="monospace" font-size="10">query_ucan</text>
  <text x="608" y="380" text-anchor="middle" fill="#85c1e9" font-family="monospace" font-size="8">capabilities</text>

  <rect x="690" y="335" width="145" height="65" rx="5" fill="url(#appGrad)" stroke="#3498db" stroke-width="1"/>
  <text x="763" y="360" text-anchor="middle" fill="#3498db" font-family="monospace" font-size="10">query_reputation</text>
  <text x="763" y="380" text-anchor="middle" fill="#85c1e9" font-family="monospace" font-size="8">scores, disputes</text>

  <!-- Infrastructure Row -->
  <text x="70" y="425" fill="#1abc9c" font-family="monospace" font-size="11" font-weight="bold">Infrastructure</text>

  <rect x="70" y="435" width="200" height="55" rx="5" fill="url(#storeGrad)" stroke="#9b59b6" stroke-width="1"/>
  <text x="170" y="460" text-anchor="middle" fill="#9b59b6" font-family="monospace" font-size="10">ReckonDB (Event Store)</text>
  <text x="170" y="478" text-anchor="middle" fill="#d4a5ff" font-family="monospace" font-size="8">Embedded event sourcing</text>

  <rect x="290" y="435" width="200" height="55" rx="5" fill="url(#storeGrad)" stroke="#1abc9c" stroke-width="1"/>
  <text x="390" y="460" text-anchor="middle" fill="#1abc9c" font-family="monospace" font-size="10">SQLite (Read Models)</text>
  <text x="390" y="478" text-anchor="middle" fill="#76d7c4" font-family="monospace" font-size="8">Projections, queries</text>

  <rect x="510" y="435" width="200" height="55" rx="5" fill="url(#storeGrad)" stroke="#e74c3c" stroke-width="1"/>
  <text x="610" y="460" text-anchor="middle" fill="#e74c3c" font-family="monospace" font-size="10">hecate_mesh</text>
  <text x="610" y="478" text-anchor="middle" fill="#f1948a" font-family="monospace" font-size="8">QUIC connection, pub/sub</text>

  <rect x="730" y="435" width="115" height="55" rx="5" fill="url(#storeGrad)" stroke="#f39c12" stroke-width="1"/>
  <text x="788" y="460" text-anchor="middle" fill="#f39c12" font-family="monospace" font-size="10">hecate_api</text>
  <text x="788" y="478" text-anchor="middle" fill="#f9e79f" font-family="monospace" font-size="8">REST handlers</text>

  <!-- CQRS Flow Label -->
  <rect x="70" y="510" width="765" height="45" rx="5" fill="#1a1a2e" stroke="#888" stroke-width="1" stroke-dasharray="4"/>
  <text x="455" y="535" text-anchor="middle" fill="#888" font-family="monospace" font-size="10">CQRS Flow: Command → ReckonDB Event → Projection → SQLite → Query</text>

  <!-- Connection Arrows -->
  <path d="M 140 145 L 140 170" stroke="#9b59b6" stroke-width="2" fill="none" marker-end="url(#arrowPurp)"/>
  <path d="M 350 145 L 350 170" stroke="#3498db" stroke-width="2" fill="none" marker-end="url(#arrowBlue2)"/>
  <path d="M 560 145 L 560 170" stroke="#2ecc71" stroke-width="2" fill="none" marker-end="url(#arrowGreen2)"/>
  <path d="M 770 145 L 763 235" stroke="#1abc9c" stroke-width="2" fill="none" marker-end="url(#arrowTeal2)"/>

  <!-- Legend -->
  <rect x="50" y="590" width="810" height="45" rx="5" fill="#0f0f15" stroke="#444" stroke-width="1"/>
  <text x="70" y="620" fill="#f39c12" font-family="monospace" font-size="10">Command Services</text>
  <text x="220" y="620" fill="#3498db" font-family="monospace" font-size="10">Query Services</text>
  <text x="350" y="620" fill="#9b59b6" font-family="monospace" font-size="10">Event Store</text>
  <text x="470" y="620" fill="#1abc9c" font-family="monospace" font-size="10">Read Models</text>
  <text x="590" y="620" fill="#e94560" font-family="monospace" font-size="10">LLM Service</text>
  <text x="710" y="620" fill="#888" font-family="monospace" font-size="10">External</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowPurp" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#9b59b6"/>
    </marker>
    <marker id="arrowBlue2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#3498db"/>
    </marker>
    <marker id="arrowGreen2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2ecc71"/>
    </marker>
    <marker id="arrowTeal2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#1abc9c"/>
    </marker>
  </defs>
</svg>
