name: Release (GitHub)

# Tag-only. Per-arch matrix builds the Erlang release tarball and a
# self-extracting executable on GitHub-hosted runners; the final job
# creates the GitHub Release and uploads every asset. macOS targets stay
# disabled (macula_nifs Rust NIFs fail to link on macOS CI).

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build Release (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 is the oldest runner GitHub still hosts (20.04 was
          # retired in 2025): GLIBC 2.35 is the floor for these binaries.
          - os: linux
            arch: amd64
            runner: ubuntu-22.04
          - os: linux
            arch: arm64
            runner: ubuntu-22.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: '27.0'

      - name: Install rebar3
        run: |
          curl -L -o rebar3 https://s3.amazonaws.com/rebar3/rebar3
          chmod +x rebar3
          sudo mv rebar3 /usr/local/bin/rebar3
          rebar3 version

      - name: Get dependencies
        run: rebar3 get-deps

      - name: Compile
        run: rebar3 compile

      - name: Build release
        run: rebar3 as prod tar

      - name: Create self-extracting executable + tarball alias
        run: |
          chmod +x scripts/make-self-extracting.sh
          TARBALL=$(find _build/prod/rel/hecate -name 'hecate-*.tar.gz' | head -n 1)
          ./scripts/make-self-extracting.sh "$TARBALL" "hecate-daemon-${{ matrix.os }}-${{ matrix.arch }}"
          cp "$TARBALL" "hecate-daemon-${{ matrix.os }}-${{ matrix.arch }}.tar.gz"

      - name: Stage release assets
        run: |
          mkdir -p /tmp/release-assets
          cp "hecate-daemon-${{ matrix.os }}-${{ matrix.arch }}" /tmp/release-assets/
          cp "hecate-daemon-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" /tmp/release-assets/
          ls -la /tmp/release-assets/

      - name: Upload artifacts (intermediate)
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: /tmp/release-assets/
          if-no-files-found: error

  publish-github-release:
    name: Publish to GitHub Releases
    runs-on: ubuntu-latest
    needs: build-release
    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/release-assets-merged
          pattern: release-*
          merge-multiple: true

      - name: List collected assets
        run: ls -la /tmp/release-assets-merged/

      - name: Create GitHub Release + upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: /tmp/release-assets-merged/*
          body: |
            ## Installation

            **Recommended: Use the installer**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/hecate-social/hecate-install/main/install.sh | bash
            ```

            **Single executable (includes bundled Erlang runtime):**
            ```bash
            # Linux (amd64)
            curl -fsSL https://github.com/hecate-social/hecate-daemon/releases/download/${{ github.ref_name }}/hecate-daemon-linux-amd64 -o hecate
            chmod +x hecate
            ./hecate start

            # Linux (arm64)
            curl -fsSL https://github.com/hecate-social/hecate-daemon/releases/download/${{ github.ref_name }}/hecate-daemon-linux-arm64 -o hecate
            chmod +x hecate
            ./hecate start
            ```

            **Tarball (advanced):**
            ```bash
            curl -fsSL https://github.com/hecate-social/hecate-daemon/releases/download/${{ github.ref_name }}/hecate-daemon-linux-amd64.tar.gz | tar xz
            ```

            ## Documentation

            - [README](https://github.com/hecate-social/hecate-daemon/blob/main/README.md)
            - [API](https://github.com/hecate-social/hecate-daemon/blob/main/docs/API.md)
            - [Architecture](https://github.com/hecate-social/hecate-daemon/blob/main/docs/ARCHITECTURE.md)

            See [CHANGELOG.md](https://github.com/hecate-social/hecate-daemon/blob/main/CHANGELOG.md) for changes.
