name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
          - os: darwin
            arch: arm64
            runner: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          rebar3-version: '3.24'

      - name: Get dependencies
        run: rebar3 get-deps

      - name: Compile
        run: rebar3 compile

      - name: Build release
        run: rebar3 as prod tar

      - name: Find and rename tarball
        run: |
          TARBALL=$(find _build/prod/rel/hecate -name 'hecate-*.tar.gz' | head -n 1)
          NEW_NAME="hecate-${{ matrix.os }}-${{ matrix.arch }}.tar.gz"
          mv "$TARBALL" "$NEW_NAME"
          echo "Renamed to: $NEW_NAME"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: hecate-${{ matrix.os }}-${{ matrix.arch }}
          path: hecate-${{ matrix.os }}-${{ matrix.arch }}.tar.gz

  create-release:
    name: Create GitHub Release
    needs: build-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: artifacts/**/*.tar.gz
          body: |
            ## Installation

            **Recommended: Use the installer**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/hecate-social/hecate-node/main/install.sh | bash
            ```

            **Manual - Linux (amd64):**
            ```bash
            curl -fsSL https://github.com/hecate-social/hecate-daemon/releases/download/${{ github.ref_name }}/hecate-linux-amd64.tar.gz | tar xz -C ~/.local/bin
            ```

            **Manual - macOS (arm64):**
            ```bash
            curl -fsSL https://github.com/hecate-social/hecate-daemon/releases/download/${{ github.ref_name }}/hecate-darwin-arm64.tar.gz | tar xz -C ~/.local/bin
            ```

            ## Documentation

            - [README](https://github.com/hecate-social/hecate-daemon/blob/main/README.md)
            - [API Documentation](https://github.com/hecate-social/hecate-daemon/blob/main/docs/API.md)
            - [Architecture](https://github.com/hecate-social/hecate-daemon/blob/main/docs/ARCHITECTURE.md)

            See [CHANGELOG.md](https://github.com/hecate-social/hecate-daemon/blob/main/CHANGELOG.md) for changes.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
