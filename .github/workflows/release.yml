name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: darwin
            arch: arm64
            runner: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          rebar3-version: '3.24'

      - name: Get dependencies
        run: rebar3 get-deps

      - name: Compile
        run: rebar3 compile

      - name: Build release
        run: rebar3 as prod tar

      - name: Create self-extracting executable
        run: |
          chmod +x scripts/make-self-extracting.sh
          TARBALL=$(find _build/prod/rel/hecate -name 'hecate-*.tar.gz' | head -n 1)
          ./scripts/make-self-extracting.sh "$TARBALL" "hecate-daemon-${{ matrix.os }}-${{ matrix.arch }}"
          # Also keep the tarball for users who prefer it
          cp "$TARBALL" "hecate-daemon-${{ matrix.os }}-${{ matrix.arch }}.tar.gz"

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: hecate-daemon-${{ matrix.os }}-${{ matrix.arch }}
          path: hecate-daemon-${{ matrix.os }}-${{ matrix.arch }}

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: hecate-daemon-${{ matrix.os }}-${{ matrix.arch }}-tarball
          path: hecate-daemon-${{ matrix.os }}-${{ matrix.arch }}.tar.gz

  create-release:
    name: Create GitHub Release
    needs: build-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            artifacts/hecate-daemon-linux-amd64/hecate-daemon-linux-amd64
            artifacts/hecate-daemon-linux-arm64/hecate-daemon-linux-arm64
            artifacts/hecate-daemon-darwin-arm64/hecate-daemon-darwin-arm64
            artifacts/hecate-daemon-*-tarball/*.tar.gz
          body: |
            ## Installation

            **Recommended: Use the installer**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/hecate-social/hecate-node/main/install.sh | bash
            ```

            **Single executable (includes bundled Erlang runtime):**
            ```bash
            # Linux (amd64)
            curl -fsSL https://github.com/hecate-social/hecate-daemon/releases/download/${{ github.ref_name }}/hecate-daemon-linux-amd64 -o hecate
            chmod +x hecate
            ./hecate start

            # macOS (arm64)
            curl -fsSL https://github.com/hecate-social/hecate-daemon/releases/download/${{ github.ref_name }}/hecate-daemon-darwin-arm64 -o hecate
            chmod +x hecate
            ./hecate start
            ```

            **Tarball (for advanced users):**
            ```bash
            curl -fsSL https://github.com/hecate-social/hecate-daemon/releases/download/${{ github.ref_name }}/hecate-daemon-linux-amd64.tar.gz | tar xz
            ```

            ## Documentation

            - [README](https://github.com/hecate-social/hecate-daemon/blob/main/README.md)
            - [API Documentation](https://github.com/hecate-social/hecate-daemon/blob/main/docs/API.md)
            - [Architecture](https://github.com/hecate-social/hecate-daemon/blob/main/docs/ARCHITECTURE.md)

            See [CHANGELOG.md](https://github.com/hecate-social/hecate-daemon/blob/main/CHANGELOG.md) for changes.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
