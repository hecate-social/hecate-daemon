name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: write

jobs:
  cleanup-artifacts:
    name: Clean up old artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Delete all existing artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            for (const artifact of data.artifacts) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
              console.log(`Deleted artifact: ${artifact.name} (${artifact.id})`);
            }

  build-release:
    name: Build Release (${{ matrix.os }}-${{ matrix.arch }})
    needs: cleanup-artifacts
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          # Use Ubuntu 20.04 for Linux builds for wider glibc compatibility
          # (Ubuntu 20.04 has GLIBC 2.31, works on most systems)
          - os: linux
            arch: amd64
            runner: ubuntu-20.04
          - os: linux
            arch: arm64
            runner: ubuntu-22.04-arm  # 20.04-arm not available, 22.04 is oldest arm64
          # darwin-arm64 disabled: macula_nifs Rust NIFs fail to link on
          # macOS CI (missing BEAM NIF symbols). Re-enable when precompiled
          # NIF binaries are available or CI toolchain is fixed.
          # - os: darwin
          #   arch: arm64
          #   runner: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          rebar3-version: '3.27.0'
          version-type: strict

      - name: Get dependencies
        run: rebar3 get-deps

      - name: Compile
        run: rebar3 compile

      - name: Build release
        run: rebar3 as prod tar

      - name: Create self-extracting executable
        run: |
          chmod +x scripts/make-self-extracting.sh
          TARBALL=$(find _build/prod/rel/hecate -name 'hecate-*.tar.gz' | head -n 1)
          ./scripts/make-self-extracting.sh "$TARBALL" "hecate-daemon-${{ matrix.os }}-${{ matrix.arch }}"
          # Also keep the tarball for users who prefer it
          cp "$TARBALL" "hecate-daemon-${{ matrix.os }}-${{ matrix.arch }}.tar.gz"

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: hecate-daemon-${{ matrix.os }}-${{ matrix.arch }}
          path: hecate-daemon-${{ matrix.os }}-${{ matrix.arch }}
          retention-days: 1

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: hecate-daemon-${{ matrix.os }}-${{ matrix.arch }}-tarball
          path: hecate-daemon-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
          retention-days: 1

  create-release:
    name: Create GitHub Release
    needs: build-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            artifacts/hecate-daemon-linux-amd64/hecate-daemon-linux-amd64
            artifacts/hecate-daemon-linux-arm64/hecate-daemon-linux-arm64
            artifacts/hecate-daemon-*-tarball/*.tar.gz
          body: |
            ## Installation

            **Recommended: Use the installer**
            ```bash
            curl -fsSL https://macula.io/hecate/install.sh | bash
            ```

            **Single executable (includes bundled Erlang runtime):**
            ```bash
            # Linux (amd64)
            curl -fsSL https://github.com/hecate-social/hecate-daemon/releases/download/${{ github.ref_name }}/hecate-daemon-linux-amd64 -o hecate
            chmod +x hecate
            ./hecate start

            # Linux (arm64)
            curl -fsSL https://github.com/hecate-social/hecate-daemon/releases/download/${{ github.ref_name }}/hecate-daemon-linux-arm64 -o hecate
            chmod +x hecate
            ./hecate start
            ```

            **Tarball (for advanced users):**
            ```bash
            curl -fsSL https://github.com/hecate-social/hecate-daemon/releases/download/${{ github.ref_name }}/hecate-daemon-linux-amd64.tar.gz | tar xz
            ```

            ## Documentation

            - [README](https://github.com/hecate-social/hecate-daemon/blob/main/README.md)
            - [API Documentation](https://github.com/hecate-social/hecate-daemon/blob/main/docs/API.md)
            - [Architecture](https://github.com/hecate-social/hecate-daemon/blob/main/docs/ARCHITECTURE.md)

            See [CHANGELOG.md](https://github.com/hecate-social/hecate-daemon/blob/main/CHANGELOG.md) for changes.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
