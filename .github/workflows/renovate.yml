name: Renovate

# Self-hosted Renovate on GitHub Actions, against this repo. Keeps the
# `macula` SDK family in lock-step with hex.pm and auto-merges the bump
# on green (config lives in-repo: renovate.json5).
#
# Requires a repo Actions secret RENOVATE_TOKEN — a GitHub personal
# access token with `repo` (contents, pull requests, workflows) scope
# for this repo, so Renovate can push the branch, open the PR, and
# enable auto-merge. The default GITHUB_TOKEN cannot be used: PRs it
# opens never trigger the CI that auto-merge waits for.

on:
  schedule:
    - cron: "17 5 * * *"   # daily ~05:17 UTC
  workflow_dispatch:
    inputs:
      logLevel:
        description: "Renovate log level"
        default: "info"

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Run Renovate
        uses: renovatebot/github-action@v41
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: hecate-social/hecate-daemon
          RENOVATE_AUTODISCOVER: "false"
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: "required"
          RENOVATE_GIT_AUTHOR: "Renovate Bot <renovate-bot@users.noreply.github.com>"
          LOG_LEVEL: ${{ github.event.inputs.logLevel || 'info' }}
