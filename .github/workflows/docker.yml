name: Docker Build & Push (multi-arch release)

# Tag-only. Push-to-main builds happen on the Forgejo runner
# (.forgejo/workflows/ci.yml) and only produce amd64. This workflow
# handles multi-arch release builds (amd64 + arm64) on tags, using
# GitHub-hosted runners (ubuntu-latest for amd64, ubuntu-22.04-arm for
# arm64). Both arches push to registry.macula.io; the manifest job
# combines them and writes :latest.
on:
  push:
    tags: ['v*']

env:
  REGISTRY: registry.macula.io
  IMAGE_NAME: registry.macula.io/hecate-daemon

jobs:
  build-amd64:
    name: Build (amd64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry.macula.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.MACULA_REGISTRY_USER }}
          password: ${{ secrets.MACULA_REGISTRY_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},suffix=-amd64
            type=sha,prefix=,suffix=-amd64

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,scope=amd64,mode=max
          provenance: false

  build-arm64:
    name: Build (arm64)
    runs-on: ubuntu-22.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry.macula.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.MACULA_REGISTRY_USER }}
          password: ${{ secrets.MACULA_REGISTRY_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},suffix=-arm64

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,scope=arm64,mode=max
          provenance: false

  manifest:
    name: Create multi-arch manifest
    runs-on: ubuntu-latest
    needs: [build-amd64, build-arm64]
    if: needs.build-amd64.result == 'success' && needs.build-arm64.result == 'success'

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry.macula.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.MACULA_REGISTRY_USER }}
          password: ${{ secrets.MACULA_REGISTRY_TOKEN }}

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create and push manifests
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          IMAGE="${{ env.IMAGE_NAME }}"

          # Full version manifest (e.g. :1.2.3)
          docker manifest create "${IMAGE}:${VERSION}" \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-arm64"
          docker manifest push "${IMAGE}:${VERSION}"

          # :latest = latest tagged release
          docker manifest create "${IMAGE}:latest" \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-arm64"
          docker manifest push "${IMAGE}:latest"

          # Major.minor convenience tag (e.g. :1.2)
          MAJOR_MINOR=$(echo "$VERSION" | cut -d. -f1,2)
          docker manifest create "${IMAGE}:${MAJOR_MINOR}" \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-arm64"
          docker manifest push "${IMAGE}:${MAJOR_MINOR}"
