name: Docker Build & Push

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Build amd64 - runs on every push
  build-amd64:
    name: Build (amd64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,suffix=-amd64
            type=semver,pattern={{version}},suffix=-amd64
            type=sha,prefix=,suffix=-amd64

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,scope=amd64,mode=max

  # Build arm64 - only runs on tags (releases)
  build-arm64:
    name: Build (arm64)
    runs-on: ubuntu-22.04-arm
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},suffix=-arm64
            type=sha,prefix=,suffix=-arm64

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,scope=arm64,mode=max

  # Create multi-arch manifest
  manifest:
    name: Create Manifest
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    needs: [build-amd64, build-arm64]
    # Run even if arm64 was skipped (non-tag push)
    if: always() && needs.build-amd64.result == 'success'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Create and push manifest
        run: |
          # Process each tag
          echo "${{ steps.meta.outputs.tags }}" | while read TAG; do
            [ -z "$TAG" ] && continue
            echo "Creating manifest for: $TAG"

            # Check which arch images exist
            AMD64_TAG="${TAG}-amd64"
            ARM64_TAG="${TAG}-arm64"

            IMAGES=""
            if docker manifest inspect "$AMD64_TAG" > /dev/null 2>&1; then
              IMAGES="$IMAGES $AMD64_TAG"
            fi
            if docker manifest inspect "$ARM64_TAG" > /dev/null 2>&1; then
              IMAGES="$IMAGES $ARM64_TAG"
            fi

            if [ -n "$IMAGES" ]; then
              echo "  Images:$IMAGES"
              docker manifest create "$TAG" $IMAGES
              docker manifest push "$TAG"
            else
              echo "  No images found, skipping"
            fi
          done
