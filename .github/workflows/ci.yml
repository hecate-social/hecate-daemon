name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28.0'
          rebar3-version: '3.27.0'
          version-type: strict

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: ${{ runner.os }}-erlang-${{ hashFiles('rebar.lock') }}
          restore-keys: |
            ${{ runner.os }}-erlang-

      - name: Get dependencies
        run: rebar3 get-deps

      - name: Compile
        run: rebar3 compile

      - name: Run EUnit tests
        run: rebar3 eunit

      - name: Run Common Test
        run: rebar3 ct || true  # CT may not exist yet

      - name: Run Dialyzer
        run: rebar3 dialyzer
        continue-on-error: true  # TODO: Fix dialyzer warnings in ALC, mentor_agents, manage_connectors

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28.0'
          rebar3-version: '3.27.0'
          version-type: strict

      - name: Check formatting (if elvis available)
        run: |
          if command -v elvis &> /dev/null; then
            elvis rock
          else
            echo "Elvis not installed, skipping format check"
          fi
        continue-on-error: true

      - name: Check for TODOs in critical code
        run: |
          if grep -r "TODO" apps/*/src/*.erl 2>/dev/null; then
            echo "Warning: Found TODOs in source code"
          fi
        continue-on-error: true

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Forbid inline mesh topic strings
        # Fails the build on inline topic literals — drift like the
        # dot-form realm publisher (silently dead for months) cannot
        # land. See scripts/check-no-inline-topics.sh for patterns +
        # exemptions and macula's docs/guides/TOPIC_NAMING_GUIDE.md
        # for the canonical builders.
        run: ./scripts/check-no-inline-topics.sh
