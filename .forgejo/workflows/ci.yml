name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: registry.macula.io
  IMAGE_NAME: registry.macula.io/hecate-daemon

jobs:
  build:
    name: Build + test (OTP ${{ matrix.otp }})
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        otp: ['28.0']
    container:
      image: docker.io/library/erlang:28.0

    steps:
      # erlang:28.0 has no node; checkout@v4 is a JS action and needs node
      # in $PATH. Install once at the top.
      - name: Bootstrap node + git + ripgrep
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends nodejs git ca-certificates curl ripgrep

      - uses: https://code.forgejo.org/actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install rebar3
        run: |
          curl -L -o /usr/local/bin/rebar3 https://s3.amazonaws.com/rebar3/rebar3
          chmod +x /usr/local/bin/rebar3
          rebar3 version

      - name: Cache _build
        uses: https://code.forgejo.org/actions/cache@v4
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: ${{ runner.os }}-otp${{ matrix.otp }}-${{ hashFiles('**/rebar.config', '**/rebar.lock', '**/*.app.src') }}

      - name: Get dependencies
        run: rebar3 get-deps

      - name: Compile
        run: rebar3 compile

      - name: EUnit
        run: rebar3 eunit

      - name: Common Test
        run: rebar3 ct || true   # CT may not exist yet

      - name: Dialyzer
        # TODO: Fix dialyzer warnings in ALC, mentor_agents, manage_connectors
        run: rebar3 dialyzer || true

      - name: Forbid inline mesh topic strings
        run: ./scripts/check-no-inline-topics.sh

  docker:
    name: Build + push Docker image (amd64)
    # `host` executor (declared in beam02-builder config.yaml) — runs
    # directly on the host so we have access to the docker daemon for
    # buildx. Other jobs use the docker executor (containerised).
    runs-on: host
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

      - name: Set up Docker Buildx
        uses: https://github.com/docker/setup-buildx-action@v3

      # Push target is registry.macula.io (self-hosted zot in Falkenstein).
      # Two repo secrets required:
      #   MACULA_REGISTRY_USER  = ci-pusher
      #   MACULA_REGISTRY_TOKEN = the bcrypt-hashed password's cleartext
      - name: Log in to registry.macula.io
        uses: https://github.com/docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.MACULA_REGISTRY_USER }}
          password: ${{ secrets.MACULA_REGISTRY_TOKEN }}

      # Forgejo builds dev images on push-to-main. Tag-driven multi-arch
      # release builds happen on GHA (.github/workflows/docker.yml) where
      # arm64 cross-build is free via ubuntu-22.04-arm. Forgejo only writes
      # `:main` and `:<sha>`; never `:latest` (that's reserved for tagged
      # releases by GHA).
      - name: Extract metadata
        id: meta
        uses: https://github.com/docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=

      # Defaults to native single-platform (amd64 on beam02-builder), no
      # manifest list, no attestation — zot rejects the OCI image index
      # that buildx emits when `platforms` or `provenance: false` is set
      # explicitly. Multi-arch lives in GHA on tag.
      - name: Build and push
        uses: https://github.com/docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
